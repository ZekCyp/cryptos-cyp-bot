name: Cryptos.cyp otomatik paylaşım

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Deneme modu (Instagram'a gönderme, sadece içeriği üret)"
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: cryptos-post
  cancel-in-progress: false

jobs:
  post:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run || 'false' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Bağımlılıkları kur
        run: pip install -r requirements.txt

      - name: Haberi seç, yaz, doğrula ve kartı üret
        id: prep
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL }}
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
        run: python -m bot.main prepare

      - name: Görseli herkese açık adrese yükle (media dalı)
        id: media
        if: env.DRY_RUN != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          IMG="${{ steps.prep.outputs.image_path }}"
          NAME="$(basename "$IMG")"
          TMP="$(mktemp -d)"
          cp "$IMG" "$TMP/$NAME"
          cd "$TMP"
          git init -q -b media
          git config user.name "cryptos-bot"
          git config user.email "cryptos-bot@users.noreply.github.com"
          git add "$NAME" && git commit -qm "media $NAME"
          git push -qf "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git" media
          SHA="$(git rev-parse HEAD)"
          URL="https://cdn.jsdelivr.net/gh/${{ github.repository }}@${SHA}/${NAME}"
          for i in $(seq 1 12); do
            CT="$(curl -sIL -o /dev/null -w '%{http_code} %{content_type}' "$URL" || true)"
            echo "jsDelivr: $CT"
            [[ "$CT" == 200\ image/jpeg* ]] && break
            sleep 5
          done
          [[ "$CT" == 200\ image/jpeg* ]] || URL="https://raw.githubusercontent.com/${{ github.repository }}/${SHA}/${NAME}"
          echo "url=$URL" >> "$GITHUB_OUTPUT"
          echo "Görsel adresi: $URL"

      - name: Instagram'da yayınla
        if: env.DRY_RUN != 'true'
        env:
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          GH_PAT: ${{ secrets.GH_PAT }}
        run: python -m bot.main publish "${{ steps.media.outputs.url }}"

      - name: Paylaşım geçmişini kaydet
        if: env.DRY_RUN != 'true'
        run: |
          git config user.name "cryptos-bot"
          git config user.email "cryptos-bot@users.noreply.github.com"
          git add state/history.json
          git diff --cached --quiet || git commit -qm "paylaşım: $(date -u +%Y-%m-%dT%H:%MZ)"
          git pull -q --rebase && git push -q

      - name: Çıktıları sakla (kart + metin)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: paylasim-${{ github.run_number }}
          path: |
            output/
            posts/
          retention-days: 30
